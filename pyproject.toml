[project]
name = "meta_scaler"
version = "1.0.0"
description = "A 4-road traffic light controller OpenEnv environment"
requires-python = ">=3.10"

dependencies = [
    "openenv-core==0.2.1",
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests",
    "openai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
